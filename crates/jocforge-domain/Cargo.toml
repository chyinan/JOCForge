[package]
name = "jocforge-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
test-support = []

[lints]
workspace = true

[dependencies]
earshot = "=1.2.2"
multiversion = "=0.8.1"
rayon = { version = "=1.11.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
num-bigint = { version = "=0.4.6", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
roxmltree = { version = "=0.21.1", default-features = true }

[dev-dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip"] }
