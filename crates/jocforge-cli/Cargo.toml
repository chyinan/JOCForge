[package]
name = "jocforge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = ["jocforge-pipeline/test-support"]

[dependencies]
jocforge-application = { path = "../jocforge-application", default-features = false }
jocforge-pipeline = { path = "../jocforge-pipeline" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "=4.5.54", features = ["derive", "string"] }
clap_complete = "=4.5.65"
jocforge-application = { path = "../jocforge-application", default-features = false, features = ["parallel"] }

[dev-dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
jocforge-application = { path = "../jocforge-application", features = ["test-support"] }
jocforge-domain = { path = "../jocforge-domain", features = ["test-support"] }
jocforge-io = { path = "../jocforge-io", features = ["test-support"] }
jocforge-pipeline = { path = "../jocforge-pipeline", features = ["test-support"] }

[lints]
workspace = true
