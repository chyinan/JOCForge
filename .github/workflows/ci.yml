name: Rust CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --locked -p jocforge --test meter_source_bridge
      - run: cargo test --locked -p jocforge-application --test prepared_job_input
      - run: cargo test --locked -p jocforge --test migration_boundary
      - run: cargo test --locked -p jocforge-domain --features test-support --lib supported_track_counts_use_the_same_semantic_row_bindings
