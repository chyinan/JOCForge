[workspace]
members = [
    "crates/jocforge-domain",
    "crates/jocforge-io",
    "crates/jocforge-application",
    "crates/jocforge-cli",
    "crates/jocforge-validation",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
